[project]
name = "app-codex"
version = "0.1.0"
description = "Codex SDK execution microservice with Redis queue limiting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2,<6",
    "openai-codex==0.144.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

